<svg xmlns="http://www.w3.org/2000/svg" width="760" height="580" viewBox="0 0 760 580"
     font-family="'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title    { fill:#1f2328; font-size:22px; font-weight:700; }
    .subtitle { fill:#656d76; font-size:12.5px; }
    .box      { fill:#f6f8fa; stroke:#d0d7de; stroke-width:1.5; }
    .box-accent { fill:#ddf4ff; stroke:#54aeff; stroke-width:1.5; }
    .box-opt  { fill:#f6f8fa; stroke:#8b949e; stroke-width:1.5; stroke-dasharray:6 4; }
    .res      { fill:#fff8c5; stroke:#d4a72c; stroke-width:1.3; }
    .label    { fill:#1f2328; font-size:15px; font-weight:600; }
    .label-sm { fill:#57606a; font-size:11.5px; }
    .flow     { stroke:#8b949e; stroke-width:2; fill:none; }
    .dash     { stroke:#afb8c1; stroke-width:1.6; stroke-dasharray:4 4; fill:none; }
    .ahead    { fill:#8b949e; }
    text { text-anchor:middle; }
    @media (prefers-color-scheme: dark) {
      .title    { fill:#e6edf3; }
      .subtitle { fill:#8b949e; }
      .box      { fill:#161b22; stroke:#30363d; }
      .box-accent { fill:#0d2d4e; stroke:#1f6feb; }
      .box-opt  { fill:#161b22; stroke:#6e7681; }
      .res      { fill:#2b2712; stroke:#9e8420; }
      .label    { fill:#e6edf3; }
      .label-sm { fill:#9198a1; }
      .flow     { stroke:#6e7681; }
      .dash     { stroke:#484f58; }
      .ahead    { fill:#6e7681; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ahead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <text class="title"    x="385" y="34">MeetingScribe pipeline</text>
  <text class="subtitle" x="385" y="54">local and offline; audio never leaves the host</text>

  <!-- flow arrows -->
  <path class="flow" marker-end="url(#arrow)" d="M240,128 L240,156"/>
  <path class="flow" marker-end="url(#arrow)" d="M240,212 L240,240"/>
  <path class="flow" marker-end="url(#arrow)" d="M240,296 L240,324"/>
  <path class="flow" marker-end="url(#arrow)" d="M240,380 L240,408"/>
  <path class="flow" marker-end="url(#arrow)" d="M240,464 L240,492"/>

  <!-- resource connectors -->
  <path class="dash" marker-end="url(#arrow)"   d="M410,269 L487,269"/>
  <path class="dash" marker-end="url(#arrow)"   d="M410,353 L487,353"/>
  <path class="dash" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M412,437 L487,437"/>

  <!-- main stages -->
  <rect class="box" x="70" y="74" width="340" height="54" rx="9"/>
  <text class="label"    x="240" y="98">input/</text>
  <text class="label-sm" x="240" y="116">audio &amp; video files</text>

  <rect class="box" x="70" y="158" width="340" height="54" rx="9"/>
  <text class="label"    x="240" y="182">ffmpeg</text>
  <text class="label-sm" x="240" y="200">convert to 16 kHz mono WAV</text>

  <rect class="box-accent" x="70" y="242" width="340" height="54" rx="9"/>
  <text class="label"    x="240" y="266">faster-whisper</text>
  <text class="label-sm" x="240" y="284">speech to text (transcription)</text>

  <rect class="box-opt" x="70" y="326" width="340" height="54" rx="9"/>
  <text class="label"    x="240" y="350">pyannote</text>
  <text class="label-sm" x="240" y="368">speaker diarization (optional, needs HF_TOKEN)</text>

  <rect class="box-accent" x="70" y="410" width="340" height="54" rx="9"/>
  <text class="label"    x="240" y="434">speaker recognition</text>
  <text class="label-sm" x="240" y="452">match &amp; enroll voiceprints</text>

  <rect class="box" x="70" y="494" width="340" height="54" rx="9"/>
  <text class="label"    x="240" y="518">output/</text>
  <text class="label-sm" x="240" y="536">transcript (.txt)</text>

  <!-- resources -->
  <rect class="res" x="490" y="247" width="210" height="44" rx="8"/>
  <text class="label"    x="595" y="266">models/</text>
  <text class="label-sm" x="595" y="282">Whisper + pyannote (local)</text>

  <rect class="res" x="490" y="331" width="210" height="44" rx="8"/>
  <text class="label"    x="595" y="350">config.env</text>
  <text class="label-sm" x="595" y="366">HF_TOKEN</text>

  <rect class="res" x="490" y="415" width="210" height="44" rx="8"/>
  <text class="label"    x="595" y="434">speakers/</text>
  <text class="label-sm" x="595" y="450">voiceprint database</text>
</svg>
